<!DOCTYPE html>
<html>
<head>
  <title>GL Macau</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#050b23;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      color:white;
      overflow:hidden;
    }

    .card{
      width:360px;
      background:#101936;
      border-radius:28px;
      padding:35px;
      box-shadow:0 0 50px rgba(103,58,255,.35);
      border:1px solid rgba(255,255,255,.08);
    }

    .logo{
      text-align:center;
      font-size:38px;
      font-weight:bold;
      margin-bottom:10px;
      background:linear-gradient(90deg,#9b5cff,#3b82f6);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .welcome{
      text-align:center;
      font-size:28px;
      font-weight:bold;
      margin-bottom:8px;
    }

    .sub{
      text-align:center;
      color:#9ca3af;
      margin-bottom:25px;
    }

    input{
      width:100%;
      padding:16px;
      border:none;
      outline:none;
      border-radius:18px;
      margin-top:12px;
      background:#1a2550;
      color:white;
      font-size:15px;
    }

    button{
      width:100%;
      padding:16px;
      border:none;
      border-radius:18px;
      margin-top:22px;
      background:linear-gradient(to right,#9333ea,#2563eb);
      color:white;
      font-size:18px;
      cursor:pointer;
      font-weight:bold;
    }

    .register{
      text-align:center;
      margin-top:20px;
      color:#aaa;
    }

    .register span{
      color:#9b5cff;
      font-weight:bold;
    }
  </style>
</head>

<body>

<div class="card">
  <div class="logo">GL Macau</div>

  <div class="welcome">
    Welcome Back!
  </div>

  <div class="sub">
    Sign in to continue your journey
  </div>

  <input type="text" placeholder="Username">
  <input type="password" placeholder="Password">

  <button>Sign In</button>

  <div class="register">
    Don't have an account?
    <span>Register now</span>
  </div>
</div>

</body>
</html>
