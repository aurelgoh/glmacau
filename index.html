<!DOCTYPE html>
<html>
<head>
<title>GLMacau</title>

<style>
body{
background:#060b26;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

.box{
width:350px;
background:#0d1635;
padding:30px;
border-radius:20px;
box-shadow:0 0 30px rgba(100,100,255,0.3);
color:white;
}

h1{
text-align:center;
}

input{
width:100%;
padding:15px;
margin-top:10px;
border-radius:20px;
border:none;
background:#101c44;
color:white;
}

button{
width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:30px;
background:linear-gradient(to right,purple,dodgerblue);
color:white;
font-size:18px;
}
</style>

</head>

<body>

<div class="box">
<h1>GLMacau</h1>

<input type="text" placeholder="Username">
<input type="password" placeholder="Password">

<button>Sign In</button>

</div>

</body>
</html>
